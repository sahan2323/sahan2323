<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 200" width="1000" height="200" role="img">
  <defs>
  <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
    <path d="M28 0H0V28" fill="none" stroke="#161C24" stroke-width="1"/>
  </pattern>
  <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%"   stop-color="#4D8FFF" stop-opacity="0"/>
    <stop offset="50%"  stop-color="#7FB2FF" stop-opacity="0.55"/>
    <stop offset="100%" stop-color="#4D8FFF" stop-opacity="0"/>
  </linearGradient>
  <linearGradient id="edgeFade" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%"   stop-color="#0D1117" stop-opacity="1"/>
    <stop offset="12%"  stop-color="#0D1117" stop-opacity="0"/>
    <stop offset="88%"  stop-color="#0D1117" stop-opacity="0"/>
    <stop offset="100%" stop-color="#0D1117" stop-opacity="1"/>
  </linearGradient>
  <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="6" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
</defs>
  <style>
    text { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; }

    .st { opacity: 1; animation: fadein .5s ease-out both; }
    @keyframes fadein { from { opacity:0 } to { opacity:1 } }
    .core { animation: glow 5.4s ease-in-out infinite; }
    @keyframes glow { 0%,100% { opacity:.25 } 8% { opacity:1 } 20% { opacity:.25 } }
    .loop { animation: dash 3s linear infinite; }
    @keyframes dash { to { stroke-dashoffset: -36 } }

    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; }
    }

  </style>

  <rect width="1000" height="200" fill="#0D1117"/>
  <text x="500.0" y="34" font-size="11" letter-spacing="5" fill="#7D8590" text-anchor="middle">THE LOOP</text>
  <line x1="90" y1="96" x2="910" y2="96" stroke="#21262D" stroke-width="1.5"/>
  <path class="loop" d="M 910 96 C 960 166, 40 166, 90 96" fill="none" stroke="#21262D" stroke-width="1.5" stroke-dasharray="4 5"/>
  
  <g class="st" style="animation-delay:0.25s">
    <circle cx="90" cy="96" r="7" fill="#0D1117" stroke="#0047AB" stroke-width="2"/>
    <circle class="core" style="animation-delay:0.0s" cx="90" cy="96" r="3.5" fill="#4D8FFF"/>
    <text x="90" y="70" font-size="12" letter-spacing="2" fill="#E6EDF3" text-anchor="middle">LEARN</text>
  </g>
  <g class="st" style="animation-delay:0.45s">
    <circle cx="254" cy="96" r="7" fill="#0D1117" stroke="#0047AB" stroke-width="2"/>
    <circle class="core" style="animation-delay:0.9s" cx="254" cy="96" r="3.5" fill="#4D8FFF"/>
    <text x="254" y="70" font-size="12" letter-spacing="2" fill="#E6EDF3" text-anchor="middle">BUILD</text>
  </g>
  <g class="st" style="animation-delay:0.65s">
    <circle cx="418" cy="96" r="7" fill="#0D1117" stroke="#0047AB" stroke-width="2"/>
    <circle class="core" style="animation-delay:1.8s" cx="418" cy="96" r="3.5" fill="#4D8FFF"/>
    <text x="418" y="70" font-size="12" letter-spacing="2" fill="#E6EDF3" text-anchor="middle">BREAK</text>
  </g>
  <g class="st" style="animation-delay:0.85s">
    <circle cx="582" cy="96" r="7" fill="#0D1117" stroke="#0047AB" stroke-width="2"/>
    <circle class="core" style="animation-delay:2.7s" cx="582" cy="96" r="3.5" fill="#4D8FFF"/>
    <text x="582" y="70" font-size="12" letter-spacing="2" fill="#E6EDF3" text-anchor="middle">UNDERSTAND</text>
  </g>
  <g class="st" style="animation-delay:1.05s">
    <circle cx="746" cy="96" r="7" fill="#0D1117" stroke="#0047AB" stroke-width="2"/>
    <circle class="core" style="animation-delay:3.6s" cx="746" cy="96" r="3.5" fill="#4D8FFF"/>
    <text x="746" y="70" font-size="12" letter-spacing="2" fill="#E6EDF3" text-anchor="middle">IMPROVE</text>
  </g>
  <g class="st" style="animation-delay:1.25s">
    <circle cx="910" cy="96" r="7" fill="#0D1117" stroke="#0047AB" stroke-width="2"/>
    <circle class="core" style="animation-delay:4.5s" cx="910" cy="96" r="3.5" fill="#4D8FFF"/>
    <text x="910" y="70" font-size="12" letter-spacing="2" fill="#E6EDF3" text-anchor="middle">SHIP</text>
  </g>
  <circle r="4" fill="#7FB2FF" filter="url(#soft)">
    <animateMotion dur="6s" repeatCount="indefinite"
      path="M 90 96 L 910 96 C 960 166, 40 166, 90 96"/>
  </circle>
  <text x="500.0" y="182" font-size="11" letter-spacing="3" fill="#7D8590" text-anchor="middle">STILL RUNNING</text>

</svg>

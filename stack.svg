<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 330" width="1000" height="330" role="img">
  <defs>
  <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
    <path d="M28 0H0V28" fill="none" stroke="#161C24" stroke-width="1"/>
  </pattern>
  <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%"   stop-color="#4D8FFF" stop-opacity="0"/>
    <stop offset="50%"  stop-color="#7FB2FF" stop-opacity="0.55"/>
    <stop offset="100%" stop-color="#4D8FFF" stop-opacity="0"/>
  </linearGradient>
  <linearGradient id="edgeFade" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%"   stop-color="#0D1117" stop-opacity="1"/>
    <stop offset="12%"  stop-color="#0D1117" stop-opacity="0"/>
    <stop offset="88%"  stop-color="#0D1117" stop-opacity="0"/>
    <stop offset="100%" stop-color="#0D1117" stop-opacity="1"/>
  </linearGradient>
  <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="6" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
</defs>
  <style>
    text { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; }

    .row { opacity: 1; animation: slide .5s ease-out both; }
    @keyframes slide { from { opacity:0; transform: translateX(-12px) } to { opacity:1; transform:none } }
    .tick { animation: pulse 5s ease-in-out infinite; }
    @keyframes pulse { 0%,100% { opacity:.35 } 50% { opacity:1 } }
    .ping2 { animation: ping2 2.4s ease-out infinite; transform-origin: 55px 307px; }
    @keyframes ping2 { 0% { transform: scale(1); opacity:.7 } 70%,100% { transform: scale(4); opacity:0 } }

    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; }
    }

  </style>

  <rect width="1000" height="330" rx="6" fill="#0D1117" stroke="#21262D"/>
  <rect width="1000" height="330" rx="6" fill="url(#grid)" opacity="0.5"/>
  <text x="52" y="52" font-size="12" letter-spacing="5" fill="#E6EDF3">DEVELOPMENT STACK</text>
  <line x1="52" y1="68" x2="948" y2="68" stroke="#0047AB" stroke-width="1.5"/>
  
  <g class="row" style="animation-delay:0.35s">
    <rect class="tick" style="animation-delay:0.35s" x="52" y="83" width="3" height="17" fill="#0047AB"/>
    <text x="70" y="96" font-size="13" letter-spacing="3" fill="#7D8590">FRONTEND</text>
    <text x="290" y="96" font-size="14" fill="#E6EDF3">React · Next.js · TypeScript · Tailwind</text>
    <line x1="52" y1="112" x2="948" y2="112" stroke="#21262D" stroke-width="1"/>
  </g>
  <g class="row" style="animation-delay:0.51s">
    <rect class="tick" style="animation-delay:0.51s" x="52" y="119" width="3" height="17" fill="#0047AB"/>
    <text x="70" y="132" font-size="13" letter-spacing="3" fill="#7D8590">BACKEND</text>
    <text x="290" y="132" font-size="14" fill="#E6EDF3">Node.js · Express · REST · Auth</text>
    <line x1="52" y1="148" x2="948" y2="148" stroke="#21262D" stroke-width="1"/>
  </g>
  <g class="row" style="animation-delay:0.67s">
    <rect class="tick" style="animation-delay:0.67s" x="52" y="155" width="3" height="17" fill="#0047AB"/>
    <text x="70" y="168" font-size="13" letter-spacing="3" fill="#7D8590">DATA</text>
    <text x="290" y="168" font-size="14" fill="#E6EDF3">PostgreSQL · MongoDB · Oracle · SQL</text>
    <line x1="52" y1="184" x2="948" y2="184" stroke="#21262D" stroke-width="1"/>
  </g>
  <g class="row" style="animation-delay:0.83s">
    <rect class="tick" style="animation-delay:0.83s" x="52" y="191" width="3" height="17" fill="#0047AB"/>
    <text x="70" y="204" font-size="13" letter-spacing="3" fill="#7D8590">INTEGRATIONS</text>
    <text x="290" y="204" font-size="14" fill="#E6EDF3">Stripe · Third-party APIs · QR systems</text>
    <line x1="52" y1="220" x2="948" y2="220" stroke="#21262D" stroke-width="1"/>
  </g>
  <g class="row" style="animation-delay:0.99s">
    <rect class="tick" style="animation-delay:0.99s" x="52" y="227" width="3" height="17" fill="#0047AB"/>
    <text x="70" y="240" font-size="13" letter-spacing="3" fill="#7D8590">MOTION</text>
    <text x="290" y="240" font-size="14" fill="#E6EDF3">GSAP · Spline</text>
    <line x1="52" y1="256" x2="948" y2="256" stroke="#21262D" stroke-width="1"/>
  </g>
  <g class="row" style="animation-delay:1.15s">
    <rect class="tick" style="animation-delay:1.15s" x="52" y="263" width="3" height="17" fill="#0047AB"/>
    <text x="70" y="276" font-size="13" letter-spacing="3" fill="#7D8590">DEPLOYMENT</text>
    <text x="290" y="276" font-size="14" fill="#E6EDF3">Vercel</text>
    <line x1="52" y1="292" x2="948" y2="292" stroke="#21262D" stroke-width="1"/>
  </g>
  <g class="row" style="animation-delay:1.4s">
    <circle cx="55" cy="307" r="4" fill="#4D8FFF"/>
    <circle class="ping2" cx="55" cy="307" r="4" fill="#4D8FFF"/>
    <text x="70" y="312" font-size="13" letter-spacing="3" fill="#7D8590">STATUS</text>
    <text x="290" y="312" font-size="14" letter-spacing="2" fill="#4D8FFF">BUILDING</text>
  </g>

</svg>

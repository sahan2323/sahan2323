<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" width="1000" height="300" role="img">
  <defs>
  <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
    <path d="M28 0H0V28" fill="none" stroke="#161C24" stroke-width="1"/>
  </pattern>
  <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%"   stop-color="#4D8FFF" stop-opacity="0"/>
    <stop offset="50%"  stop-color="#7FB2FF" stop-opacity="0.55"/>
    <stop offset="100%" stop-color="#4D8FFF" stop-opacity="0"/>
  </linearGradient>
  <linearGradient id="edgeFade" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%"   stop-color="#0D1117" stop-opacity="1"/>
    <stop offset="12%"  stop-color="#0D1117" stop-opacity="0"/>
    <stop offset="88%"  stop-color="#0D1117" stop-opacity="0"/>
    <stop offset="100%" stop-color="#0D1117" stop-opacity="1"/>
  </linearGradient>
  <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="6" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
</defs>
  <style>
    text { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; }

    .ltr { opacity: 1; animation: reveal .45s ease-out both; }
    @keyframes reveal { from { opacity: 0 } to { opacity: 1 } }
    .fade { opacity: 1; animation: fadein .7s ease-out both; }
    @keyframes fadein { from { opacity: 0 } to { opacity: 1 } }
    .draw { stroke-dasharray: 1000; stroke-dashoffset: 0; animation: draw 1.1s ease-out .9s both; }
    @keyframes draw { from { stroke-dashoffset: 1000 } to { stroke-dashoffset: 0 } }
    .scan { animation: scan 7s linear 2s infinite; }
    @keyframes scan { from { transform: translateX(0) } to { transform: translateX(1300px) } }
    .ping { animation: ping 2.4s ease-out infinite; transform-origin: 70px 66px; }
    @keyframes ping { 0% { transform: scale(1); opacity:.7 } 70%,100% { transform: scale(4.5); opacity:0 } }
    .packet { animation: bus 4.5s cubic-bezier(.6,0,.4,1) 2.2s infinite; }
    @keyframes bus { 0% { transform: translateX(0); opacity:0 } 8% { opacity:1 }
                     92% { opacity:1 } 100% { transform: translateX(872px); opacity:0 } }

    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; }
    }

  </style>

  <rect width="1000" height="300" fill="#0D1117"/>
  <rect width="1000" height="300" fill="url(#grid)" opacity="0.9"/>
  <rect width="1000" height="300" fill="url(#edgeFade)"/>

  <!-- ambient scan -->
  <rect class="scan" x="-260" y="0" width="260" height="300" fill="url(#sweep)" opacity="0.35"/>

  <!-- status eyebrow -->
  <g class="fade" style="animation-delay:0.1s">
    <circle cx="70" cy="66" r="4" fill="#4D8FFF"/>
    <circle class="ping" cx="70" cy="66" r="4" fill="#4D8FFF"/>
    <text x="88" y="71" font-size="13" letter-spacing="4" fill="#7D8590">SYSTEM ONLINE</text>
    <text x="936" y="71" font-size="13" letter-spacing="4" fill="#7D8590" text-anchor="end">TORONTO · CA</text>
  </g>

  <!-- name -->
  <text x="64" y="150" font-size="54" font-weight="700" letter-spacing="6" fill="#E6EDF3"><tspan class="ltr" style="animation-delay:0.50s">S</tspan><tspan class="ltr" style="animation-delay:0.55s">A</tspan><tspan class="ltr" style="animation-delay:0.60s">H</tspan><tspan class="ltr" style="animation-delay:0.65s">A</tspan><tspan class="ltr" style="animation-delay:0.70s">N</tspan><tspan class="ltr" style="animation-delay:0.75s">&#160;</tspan><tspan class="ltr" style="animation-delay:0.80s">V</tspan><tspan class="ltr" style="animation-delay:0.85s">I</tspan><tspan class="ltr" style="animation-delay:0.90s">M</tspan><tspan class="ltr" style="animation-delay:0.95s">U</tspan><tspan class="ltr" style="animation-delay:1.00s">K</tspan><tspan class="ltr" style="animation-delay:1.05s">T</tspan><tspan class="ltr" style="animation-delay:1.10s">H</tspan><tspan class="ltr" style="animation-delay:1.15s">I</tspan></text>

  <!-- rule that draws in -->
  <line class="draw" x1="64" y1="178" x2="936" y2="178" stroke="#0047AB" stroke-width="2"/>

  <!-- role -->
  <text class="fade" style="animation-delay:1.5s" x="64" y="215" font-size="16" letter-spacing="3" fill="#4D8FFF">
    FULL-STACK DEVELOPER<tspan fill="#7D8590">   ·   </tspan>SOFTWARE ENGINEER<tspan fill="#7D8590">   ·   </tspan>BUILDER
  </text>

  <!-- signal bus -->
  <g class="fade" style="animation-delay:1.8s">
    <line x1="64" y1="254" x2="936" y2="254" stroke="#21262D" stroke-width="1"/>
    <text x="64" y="278" font-size="12" letter-spacing="3" fill="#7D8590">
      FRONTEND <tspan fill="#0047AB">→</tspan> BACKEND <tspan fill="#0047AB">→</tspan> DATABASE <tspan fill="#0047AB">→</tspan> INTEGRATION <tspan fill="#0047AB">→</tspan> PRODUCT
    </text>
    <circle class="packet" cx="64" cy="254" r="3.5" fill="#7FB2FF" filter="url(#soft)"/>
  </g>

</svg>

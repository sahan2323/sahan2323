<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 76" width="1000" height="76" role="img">
  <defs>
  <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
    <path d="M28 0H0V28" fill="none" stroke="#161C24" stroke-width="1"/>
  </pattern>
  <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#4D8FFF" stop-opacity="0"/>
    <stop offset="50%" stop-color="#7FB2FF" stop-opacity="0.5"/>
    <stop offset="100%" stop-color="#4D8FFF" stop-opacity="0"/>
  </linearGradient>
  <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="5" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
</defs>
  <style>
    text { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; }

    .ping { animation: ping 2.2s ease-out infinite; transform-origin: 40px 38px; }
    @keyframes ping { 0% { transform: scale(1); opacity:.7 } 70%,100% { transform: scale(4); opacity:0 } }
    .scan { animation: scan 6.5s linear infinite; }
    @keyframes scan { from { transform: translateX(0) } to { transform: translateX(1280px) } }

    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>

  <rect x="1" y="1" width="998" height="74" rx="6" fill="#0D1117" stroke="#21262D"/>
  <rect x="1" y="1" width="998" height="74" rx="6" fill="url(#grid)" opacity="0.45"/>
  <rect class="scan" x="-240" y="1" width="240" height="74" fill="url(#sweep)" opacity="0.3"/>
  <rect x="1" y="1" width="4" height="74" fill="#0047AB"/>

  <circle cx="40" cy="38" r="5" fill="#4D8FFF"/>
  <circle class="ping" cx="40" cy="38" r="5" fill="#4D8FFF"/>

  <text x="62" y="32" font-size="14" letter-spacing="3" fill="#E6EDF3">OPEN TO SOFTWARE DEVELOPMENT CO-OP</text>
  <text x="62" y="54" font-size="12" letter-spacing="2" fill="#7D8590">WINTER 2027 · STARTING JANUARY · TORONTO, ON</text>

  <text x="960" y="32" font-size="12" letter-spacing="3" fill="#7D8590" text-anchor="end">SENECA POLYTECHNIC</text>
  <text x="960" y="54" font-size="12" letter-spacing="2" fill="#4D8FFF" text-anchor="end">COMPUTER PROGRAMMING &amp; ANALYSIS</text>

</svg>

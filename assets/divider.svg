<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 10" width="1000" height="10" role="img">
  <defs>
  <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
    <path d="M28 0H0V28" fill="none" stroke="#161C24" stroke-width="1"/>
  </pattern>
  <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%"   stop-color="#4D8FFF" stop-opacity="0"/>
    <stop offset="50%"  stop-color="#7FB2FF" stop-opacity="0.55"/>
    <stop offset="100%" stop-color="#4D8FFF" stop-opacity="0"/>
  </linearGradient>
  <linearGradient id="edgeFade" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%"   stop-color="#0D1117" stop-opacity="1"/>
    <stop offset="12%"  stop-color="#0D1117" stop-opacity="0"/>
    <stop offset="88%"  stop-color="#0D1117" stop-opacity="0"/>
    <stop offset="100%" stop-color="#0D1117" stop-opacity="1"/>
  </linearGradient>
  <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="6" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
</defs>
  <style>
    text { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; }

    .glint { animation: glint 5.5s linear infinite; }
    @keyframes glint { from { transform: translateX(0) } to { transform: translateX(1200px) } }

    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; }
    }

  </style>

  <rect width="1000" height="10" fill="#0D1117"/>
  <line x1="0" y1="5" x2="1000" y2="5" stroke="#21262D" stroke-width="1"/>
  <rect class="glint" x="-160" y="4" width="160" height="2" fill="url(#sweep)"/>

</svg>
